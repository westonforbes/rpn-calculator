<!doctype html>
<html lang="en">


  <head>

    <title>RPN Calculator</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#DCDDD8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2C2F31" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="RPN Calc">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

  </head>


  <body>
    <main class="stage" id="stage">
      <div class="device" id="device" role="application" aria-label="RPN calculator">

        <div class="lcd">
          <div class="status">
            <span id="msg"></span>
            <span class="right"><span id="depth"></span><span class="tag" id="modeTag"></span></span>
          </div>
          <div class="reg"><span class="name">T</span><span class="val" id="rT"></span></div>
          <div class="reg"><span class="name">Z</span><span class="val" id="rZ"></span></div>
          <div class="reg"><span class="name">Y</span><span class="val" id="rY"></span></div>
          <div class="reg x"><span class="name">X</span><span class="val" id="rX" aria-live="polite"></span></div>
        </div>

        <div class="modes">
          <div class="seg" role="group" aria-label="Number mode">
            <button class="mode" data-k="mode:DEC" aria-pressed="true" title="Decimal">DEC</button>
            <button class="mode" data-k="mode:HEX" aria-pressed="false" title="Hexadecimal, whole numbers">HEX</button>
            <button class="mode" data-k="mode:BIN" aria-pressed="false" title="Binary, whole numbers">BIN</button>
          </div>
          
          <div class="seg angle" role="group" aria-label="Angle unit">
            <button class="mode" data-k="angle:DEG" aria-pressed="true" title="Angles in degrees">DEG</button>
            <button class="mode" data-k="angle:RAD" aria-pressed="false" title="Angles in radians">RAD</button>
          </div>
        </div>

        <div class="keys" id="keys">
          <button class="key mem" data-k="mem0"><span class="mname">M1</span><span class="mval">empty</span></button>
          <button class="key mem" data-k="mem1"><span class="mname">M2</span><span class="mval">empty</span></button>
          <button class="key mem" data-k="mem2"><span class="mname">M3</span><span class="mval">empty</span></button>
          <button class="key mem" data-k="mem3"><span class="mname">M4</span><span class="mval">empty</span></button>
          <button class="key fn mc mcg" data-k="mc" title="Clear all memory registers">mc</button>

          <button class="key fn stk sto" data-k="sto" aria-pressed="false" title="Store X: press, then pick a memory key">sto</button>
          <button class="key fn stk" data-k="swap" title="Swap X and Y (S)">swap</button>
          <button class="key fn stk" data-k="pop" title="Drop X (Delete)">pop /<br>drop</button>
          <button class="key fn stk" data-k="flush" title="Clear the stack; memory is kept (Esc)">flush</button>
          <button class="key fn" data-k="back" aria-label="Backspace" title="Delete last digit; reopens X for editing (Backspace)">⌫</button>

          <button class="key fn" data-k="inv" aria-pressed="false" title="Switch sin, cos, tan to their inverses for one press (I)">inv</button>
          <button class="key fn trig" data-k="sin">sin</button>
          <button class="key fn trig" data-k="cos">cos</button>
          <button class="key fn trig" data-k="tan">tan</button>
          <button class="key fn" data-k="pi" aria-label="Pi" title="Push π (P)" style="font-size:19px">π</button>

          <div class="hexrow">
            <button class="key hex" data-k="A">A</button>
            <button class="key hex" data-k="B">B</button>
            <button class="key hex" data-k="C">C</button>
            <button class="key hex" data-k="D">D</button>
            <button class="key hex" data-k="E">E</button>
            <button class="key hex" data-k="F">F</button>
          </div>

          <button class="key num" data-k="7">7</button>
          <button class="key num" data-k="8">8</button>
          <button class="key num" data-k="9">9</button>
          <button class="key op sci" data-k="sqrt" aria-label="Square root of X" title="Square root of X (R)">√x</button>
          <button class="key op sci" data-k="^" aria-label="Y to the power of X" title="Y to the power of X (^)">yˣ</button>

          <button class="key num" data-k="4">4</button>
          <button class="key num" data-k="5">5</button>
          <button class="key num" data-k="6">6</button>
          <button class="key op" data-k="*" aria-label="Multiply" title="Y × X (*)">×</button>
          <button class="key op" data-k="+" aria-label="Add" title="Y + X (+)">+</button>

          <button class="key num" data-k="1">1</button>
          <button class="key num" data-k="2">2</button>
          <button class="key num" data-k="3">3</button>
          <button class="key op" data-k="/" aria-label="Divide" title="Y ÷ X (/)">÷</button>
          <button class="key op" data-k="-" aria-label="Subtract" title="Y − X (-)">−</button>

          <button class="key num" data-k="0">0</button>
          <button class="key num" data-k="." aria-label="Decimal point">.</button>
          <button class="key num" data-k="neg" aria-label="Change sign" title="Change sign (N)">±</button>
          <button class="key ent" data-k="enter" title="Push onto the stack, or duplicate X (Enter)">enter</button>
        </div>
        <button class="install" id="installBtn" type="button" hidden>Install app</button>
        <p class="ios-hint" id="iosHint" hidden>In Safari, tap Share, then “Add to Home Screen.”</p>
      <p class="hint">Keyboard: digits and <kbd>A–F</kbd>, <kbd>Enter</kbd>, <kbd>+ − * / ^</kbd>, <kbd>R</kbd> root, <kbd>S</kbd> swap, <kbd>N</kbd> sign, <kbd>P</kbd> π, <kbd>I</kbd> inv, <kbd>M</kbd> next mode, <kbd>Backspace</kbd> edit, <kbd>Delete</kbd> pop, <kbd>Esc</kbd> flush</p>
      </div>
    </main>

    <script src="code.js" defer></script>
  </body>
</html>
